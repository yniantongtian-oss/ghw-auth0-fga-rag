# Local OpenFGA plus the assistant. The app bootstraps model.fga and the sample tuples.
services:
  openfga:
    image: openfga/openfga:v1.8.16
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 12

  hearth:
    build: .
    ports:
      - "8000:8000"
    environment:
      FGA_API_URL: http://openfga:8080
      FGA_STORE_NAME: hearth-hr
      FGA_AUTO_BOOTSTRAP: "true"
      DEV_USER_SWITCHER: "true"
      SESSION_SECRET: dev-only-session-secret
      AUTH0_DOMAIN: dev-wvxvhbnjrgvgn26x.us.auth0.com
      AUTH0_CALLBACK_URL: http://localhost:8000/callback
    depends_on:
      openfga:
        condition: service_healthy
